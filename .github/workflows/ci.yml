name: CI

# There was no pipeline. The one test file needed a live model key and
# swallowed every exception into a print, so it passed without one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: A write through the agent's connection must fail
        # The old agent's connection was read-write and its only guard was a
        # sentence in the prompt. This runs a DELETE through the same engine
        # the agent uses and requires it to be refused by the database itself.
        run: |
          python - <<'PY'
          import sqlite3, sqlalchemy
          from db import read_only_engine
          sqlite3.connect("ci.db").executescript("CREATE TABLE t(x); INSERT INTO t VALUES (1);")
          engine = read_only_engine("sqlite:///ci.db")
          try:
              with engine.begin() as conn:
                  conn.execute(sqlalchemy.text("DELETE FROM t"))
          except sqlalchemy.exc.SQLAlchemyError as e:
              print("refused by the database:", type(e).__name__)
          else:
              raise SystemExit("the agent's connection accepted a DELETE")
          PY

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bandit
        run: bandit -r . -x ./tests,./.venv,./.venv312 -ll -f screen

      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # advisory feed availability, not a code defect

      - name: No credential or database file may be tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|\.db$|evaluations\.csv$' || true)
          if [ -n "$tracked" ]; then echo "$tracked"; echo "::error::a credential or data file is committed"; exit 1; fi
          echo "clean"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t sql-agent:ci .

      - name: The image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id sql-agent:ci -u)
          [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: Serve and answer the health check
        run: |
          docker run -d --name sa -p 8501:8501 -e LLM_API_KEY=ci-not-a-real-key sql-agent:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          echo
          docker logs sa | tail -10
          docker rm -f sa
